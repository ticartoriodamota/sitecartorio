<!-- =========================================
     HEADER OFICIAL
     CARTÓRIO DA MOTA
========================================= -->

<header class="header">

    <div class="header-top">

        <!-- =====================================
             TELEFONE
        ====================================== -->

        <div class="header-contact header-phone">

            <div class="contact-item">

                <i class="fa-solid fa-phone"></i>

                <div>

                    <small>
                        Telefone
                    </small>

                    <strong>
                        (64) 3651-1524
                    </strong>

                </div>

            </div>

        </div>


        <!-- =====================================
             LOGO
        ====================================== -->

        <a
            href="../../"
            class="main-logo"
            aria-label="Cartório da Mota"
        >

            <img
                src="../../img/logo.png"
                alt="Cartório da Mota"
            >

        </a>


        <!-- =====================================
             WHATSAPP
        ====================================== -->

        <div class="header-contact header-whatsapp">

            <div class="contact-item">

                <i class="fa-brands fa-whatsapp"></i>

                <div>

                    <small>
                        WhatsApp
                    </small>

                    <strong>
                        (64) 98162-2179
                    </strong>

                </div>

            </div>

        </div>


        <!-- =====================================
             MENU HAMBÚRGUER
        ====================================== -->

        <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </div>


    <!-- =========================================
         MENU MOBILE
    ========================================== -->

    <nav
        class="mobile-menu"
        id="mobileMenu"
        aria-hidden="true"
    >

        <div class="mobile-menu-inner">

            <a href="../../">
                <i class="fa-solid fa-house"></i>
                Início
            </a>


            <a href="../../paginas/certidoes/">
                <i class="fa-solid fa-file-circle-check"></i>
                Certidões
            </a>


            <a href="../../paginas/documentos/">
                <i class="fa-solid fa-file-lines"></i>
                Documentos
            </a>


            <a href="../../paginas/institucional/">
                <i class="fa-solid fa-building-columns"></i>
                Conheça o Cartório
            </a>


            <a href="../../paginas/noticias/">
                <i class="fa-solid fa-newspaper"></i>
                Notícias
            </a>


            <a href="../../paginas/contato/">
                <i class="fa-solid fa-phone"></i>
                Contato
            </a>


            <a href="../../paginas/restrito/">
                <i class="fa-solid fa-lock"></i>
                Área Restrita
            </a>

        </div>

    </nav>

</header>
